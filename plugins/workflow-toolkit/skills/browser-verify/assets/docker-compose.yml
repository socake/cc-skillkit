services:
  browser-verify:
    build: .
    image: browser-verify:latest
    container_name: browser-verify
    restart: unless-stopped
    shm_size: 2gb        # chromium's default /dev/shm 64MB is too small; give it 2G
    ports:
      - "6080:6080"      # noVNC web UI
      - "5900:5900"      # raw VNC (optional)
      - "9222:9222"      # Chrome DevTools Protocol
    volumes:
      - ./profile:/profile       # persist cookies/localStorage/IndexedDB
      - ./supervisord.conf:/etc/supervisor/conf.d/browser-verify.conf:ro  # tweak flags without rebuilding
    environment:
      - TZ=UTC
    # allocate a pseudo-tty so chromium output stays clean
    tty: true
