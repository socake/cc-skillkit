[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1440x900x24 -ac +extension RANDR
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
environment=DISPLAY=":0",HOME="/root"
command=/usr/bin/fluxbox -no-toolbar
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Bridge the X11 PRIMARY and CLIPBOARD selections, otherwise Chrome (CLIPBOARD)
# and older apps (PRIMARY) disagree and x11vnc sees inconsistent clipboard content.
[program:autocutsel-clipboard]
environment=DISPLAY=":0"
command=/usr/bin/autocutsel -selection CLIPBOARD -fork
autorestart=true
startsecs=2
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:autocutsel-primary]
environment=DISPLAY=":0"
command=/usr/bin/autocutsel -fork
autorestart=true
startsecs=2
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
environment=DISPLAY=":0"
# -threads   : split encoding/network across threads
# -wait 5    : pointer-event polling interval 30ms -> 5ms
# -defer 5   : framebuffer update delay 30ms -> 5ms
# -nolookup  : skip reverse DNS on connect (saves 100ms+)
# -noxrecord : disable XRECORD to cut CPU
command=/usr/bin/x11vnc -display :0 -rfbauth /profile/.vncpasswd -shared -forever -rfbport 5900
    -threads -wait 5 -defer 5 -nolookup -noxrecord
    -o /tmp/x11vnc.log
autorestart=true
startretries=20
startsecs=2
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
startretries=20
startsecs=2
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
environment=DISPLAY=":0",HOME="/profile"
command=/usr/local/bin/chrome
    --user-data-dir=/profile
    --no-sandbox
    --disable-dev-shm-usage
    --remote-debugging-port=9223
    --remote-allow-origins=*
    --window-size=1440,900
    --window-position=0,0
    --no-first-run
    --no-default-browser-check
    --disable-features=Translate,InterestFeedContentSuggestions,site-per-process
    --start-maximized
    --renderer-process-limit=4
    --js-flags=--max-old-space-size=512
    --disk-cache-size=52428800
    --process-per-site
autorestart=true
startretries=20
startsecs=3
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Chrome 137+ forces --remote-debugging-port to bind 127.0.0.1 only
# (--remote-debugging-address=0.0.0.0 has no effect). socat forwards the
# container-external 9222 to the internal 127.0.0.1:9223 chrome actually listens on.
[program:cdp-bridge]
command=/usr/bin/socat TCP-LISTEN:9222,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:9223
autorestart=true
startretries=20
startsecs=2
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
